# Builds the School ERP Android app.
# Debug APK on every run; signed release APK + Play Store bundle (.aab) when the keystore secrets are set.
#
# Repository settings → Secrets and variables → Actions:
#   Variables: ERP_URL (e.g. https://erp.yourschool.in), API_URL (e.g. https://api.yourschool.in)
#   Secrets (optional): GOOGLE_SERVICES_JSON_BASE64, ANDROID_KEYSTORE_BASE64,
#                       ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android app

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version shown to users (e.g. 1.0.1)
        required: false
      version_code:
        description: Whole number, must increase with every Play Store upload
        required: false
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      ERP_URL: ${{ vars.ERP_URL }}
      API_URL: ${{ vars.API_URL }}
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code || github.run_number }}
      # Secrets can't be tested in step conditions, so expose whether they are set.
      HAS_FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Add Firebase config (push notifications)
        if: env.HAS_FIREBASE == 'true'
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      - name: Configure and sync
        run: npm run sync

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Add signing key
        id: keystore
        if: env.HAS_KEYSTORE == 'true'
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
          echo "path=$PWD/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build signed release (APK + Play Store bundle)
        if: ${{ steps.keystore.outputs.path != '' }}
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: school-erp-android-${{ env.VERSION_CODE }}
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
