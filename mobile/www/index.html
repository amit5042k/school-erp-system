<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School ERP</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #eef3fb; color: #1f2937; padding: 24px; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 6px 24px rgba(19,59,122,.12); padding: 28px 22px; max-width: 360px; width: 100%; text-align: center; }
  .logo { width: 64px; height: 64px; border-radius: 16px; background: #133b7a; color: #fff; font-weight: 800; font-size: 24px;
    display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
  h1 { font-size: 20px; margin: 0 0 8px; color: #133b7a; }
  p { margin: 0 0 20px; color: #4b5563; line-height: 1.5; }
  button { background: #133b7a; color: #fff; border: 0; border-radius: 10px; padding: 12px 20px; font-size: 16px; font-weight: 600; width: 100%; }
  small { display: block; margin-top: 14px; color: #6b7280; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">SE</div>
    <h1>You're offline</h1>
    <p>School ERP needs an internet connection. Check your mobile data or Wi-Fi, then try again.</p>
    <button id="retry" type="button">Try again</button>
    <small id="status">Waiting for a connection…</small>
  </div>
  <script src="config.js"></script>
  <script>
    function retry() {
      document.getElementById('status').textContent = 'Connecting…';
      window.location.href = window.ERP_URL + '/home';
    }
    document.getElementById('retry').addEventListener('click', retry);
    window.addEventListener('online', retry);
  </script>
</body>
</html>
