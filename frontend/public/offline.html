<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>School ERP · Offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef3fb; color: #1f2937;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; }
  .card { background: #fff; border-radius: 16px; padding: 28px 22px; max-width: 340px; box-shadow: 0 6px 24px rgba(19,59,122,.12); }
  h1 { color: #133b7a; font-size: 20px; margin: 12px 0 6px; }
  p { color: #6b7280; font-size: 14px; line-height: 1.5; margin: 0 0 18px; }
  button { background: #1e56a8; color: #fff; border: 0; border-radius: 8px; padding: 10px 22px; font-size: 15px; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" width="64" height="64" alt="">
    <h1>You're offline</h1>
    <p>School ERP needs the internet. Check your Wi-Fi or mobile data, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
